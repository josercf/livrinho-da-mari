name: Gerar fotos dos pratos

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Dias para gerar, separados por vírgula (ex.: 3,8). Vazio gera só as fotos que faltam."
        required: false
        default: ""
      refazer:
        description: "Refazer as fotos que já existem"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Gerar fotos com o Nano Banana
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          DIAS: ${{ inputs.dias }}
          REFAZER: ${{ inputs.refazer }}
        run: node scripts/gerar-fotos.mjs
      - name: Guardar as fotos no repositório
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/img
          if git diff --cached --quiet; then
            echo "Nenhuma foto nova."
          else
            git commit -m "Fotos dos pratos geradas com o Nano Banana"
            git push
          fi

  publicar:
    needs: fotos
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages.yml
